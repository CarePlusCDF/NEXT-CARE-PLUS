[platformio]
src_dir = firmware/src
include_dir = firmware/include

[env]
platform = espressif32@6.12.0
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:pulseira]
board = esp32-c3-devkitm-1
build_src_filter = +<band.cpp>
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCARE_VIBRATION_ENABLED=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit MPU6050@2.2.6
    adafruit/Adafruit Unified Sensor@1.1.15

[env:luminaria]
board = esp32dev
build_src_filter = +<lamp.cpp>

[env:pulseira_reserva]
extends = env:pulseira
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCARE_CANCEL_PIN=20
